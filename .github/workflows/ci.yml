name: CI

# macOS 在本地开发时验证；CI 负责 Windows：跑测试并打出安装包（可在 Actions 页面下载）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows 构建与安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo test -p redpilot-core
      # 会先执行 npm run build（tsc + vite），再编译并打包 .msi / -setup.exe
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: RedPilot-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
