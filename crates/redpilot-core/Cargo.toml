[package]
name = "redpilot-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "RedPilot 核心：Redmine 同步、AI 分析、一键回派与 MCP 服务"

[[bin]]
name = "redpilot-mcp"
path = "src/bin/redpilot-mcp.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls", "http2", "charset", "system-proxy"] }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs = "6"
keyring = "4"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
schemars = "1"
rmcp = { version = "3.8", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
